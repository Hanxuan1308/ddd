<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f1220" />
  <title>脑力训练场 · NeuroArena</title>
  <meta name="description" content="2048 · 连线 · 扫雷 · 记忆翻牌 四合一经典小游戏合集" />

  <!-- PWA：可「添加到主屏幕」，像原生 App 一样全屏 + 离线 -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="脑力训练场" />

  <link rel="stylesheet" href="assets/style.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <script>
    /* 首帧前应用主题，避免闪烁 */
    try {
      var _t = localStorage.getItem("na_theme");
      _t = _t ? JSON.parse(_t) : (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", _t);
    } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
  </script>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <header class="app-header">
    <div class="brand" id="brand-home" role="button" tabindex="0" title="返回首页">
      <span class="brand-logo">🧠</span>
      <span class="brand-text">
        <strong>脑力训练场</strong>
        <small>NeuroArena · 2048 · 连线 · 扫雷 · 记忆</small>
      </span>
    </div>
    <div class="header-actions">
      <button id="stats-btn" class="icon-btn" title="能力总览" aria-label="能力总览">📊</button>
      <button id="theme-toggle" class="icon-btn" title="切换深色/浅色" aria-label="切换主题">🌙</button>
      <button id="sound-toggle" class="icon-btn" title="开/关音效" aria-label="切换音效">🔊</button>
    </div>
  </header>

  <main id="app" class="app-main">
    <!-- 各界面由 app.js 动态渲染 -->
  </main>

  <footer class="app-footer">
    <span>用键盘 / 触屏均可游玩 · 成绩自动保存在本地</span>
  </footer>

  <script src="assets/app.js"></script>
  <script>
    /* 注册 Service Worker（仅在 https/localhost 生效，file:// 会静默失败） */
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
