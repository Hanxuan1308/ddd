<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f1220" />
  <title>脑力训练场 · NeuroArena</title>
  <meta name="description" content="推理 · 思维 · 反应 · 维度 四合一大脑训练小游戏" />
  <style>
/* ============================================================
   脑力训练场 · NeuroArena
   全局样式 — 深色现代主题，响应式，支持触屏
   ============================================================ */

:root {
  --bg: #0f1220;
  --bg-soft: #161a2e;
  --panel: #1b2038;
  --panel-2: #222847;
  --line: #2c3355;
  --text: #eef1ff;
  --muted: #9aa3c7;
  --muted-2: #6f78a0;

  /* 每个技能的主题色 */
  --reason: #8b7dff;   /* 推理 · 紫 */
  --reason-2: #5b46ff;
  --logic: #2fd39a;    /* 思维 · 绿 */
  --logic-2: #17a877;
  --reaction: #ffb020; /* 反应 · 橙 */
  --reaction-2: #ff7a1a;
  --spatial: #40c4ff;  /* 维度 · 蓝 */
  --spatial-2: #2b8bff;
  --schulte: #ff7ac0;  /* 综合 · 粉 */
  --schulte-2: #e0489f;

  --good: #35d07f;
  --bad: #ff5d6c;
  --warn: #ffc857;

  --ring: rgba(255, 255, 255, .14);  /* 棋子/色块描边 */
  --peg-mark: #ffffff;               /* 反馈点标记 */
  --arena-text: #eef1ff;             /* 反应区固定浅色文字 */
  --overlay-bg: rgba(15, 18, 32, .82);

  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 18px 45px rgba(0, 0, 0, .45);
  --ease: cubic-bezier(.22, .61, .36, 1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC",
    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: radial-gradient(1200px 800px at 15% -10%, #1a2040 0%, var(--bg) 55%),
              radial-gradient(900px 700px at 110% 10%, #171a33 0%, transparent 60%),
              var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

/* 背景光晕 */
.bg-orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; filter: blur(60px); opacity: .5; }
.orb { position: absolute; border-radius: 50%; }
.orb-1 { width: 340px; height: 340px; top: -80px; left: -60px; background: #4b3bff; opacity: .35; }
.orb-2 { width: 300px; height: 300px; bottom: -100px; right: -60px; background: #17a877; opacity: .28; }
.orb-3 { width: 260px; height: 260px; top: 40%; left: 60%; background: #2b8bff; opacity: .22; }

/* ---------- 头部 ---------- */
.app-header {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px clamp(16px, 4vw, 40px);
  gap: 12px;
}
.brand { display: flex; align-items: center; gap: 12px; cursor: pointer; border-radius: 14px; padding: 6px 8px; outline: none; }
.brand:focus-visible { box-shadow: 0 0 0 2px var(--reason-2); }
.brand-logo { font-size: 30px; line-height: 1; filter: drop-shadow(0 4px 10px rgba(91, 70, 255, .5)); }
.brand-text { display: flex; flex-direction: column; }
.brand-text strong { font-size: 18px; letter-spacing: .5px; }
.brand-text small { color: var(--muted); font-size: 11px; letter-spacing: .5px; }

.icon-btn {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text);
  width: 42px; height: 42px;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
  transition: transform .15s var(--ease), background .2s;
}
.icon-btn:hover { background: var(--panel-2); transform: translateY(-1px); }
.icon-btn:active { transform: translateY(0) scale(.96); }
.icon-btn.muted { opacity: .55; }
.header-actions { display: flex; gap: 10px; }

/* ---------- 主区域 ---------- */
.app-main {
  position: relative;
  z-index: 1;
  flex: 1;
  width: 100%;
  max-width: 960px;
  margin: 0 auto;
  padding: 8px clamp(16px, 4vw, 40px) 32px;
}

.app-footer {
  position: relative;
  z-index: 1;
  text-align: center;
  color: var(--muted-2);
  font-size: 12px;
  padding: 14px;
}

/* ---------- 首页卡片 ---------- */
.home-intro { text-align: center; margin: 6px 0 22px; }
.home-intro h1 { font-size: clamp(24px, 5vw, 34px); margin: 0 0 8px; }
.home-intro p { color: var(--muted); margin: 0; font-size: 14px; }

.card-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
@media (max-width: 560px) { .card-grid { grid-template-columns: 1fr; } }

.game-card {
  position: relative;
  text-align: left;
  background: linear-gradient(160deg, var(--panel) 0%, var(--bg-soft) 100%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  overflow: hidden;
  transition: transform .2s var(--ease), border-color .2s, box-shadow .25s;
  color: var(--text);
  font: inherit;
}
.game-card::before {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(280px 160px at 100% 0%, var(--accent, #5b46ff) 0%, transparent 70%);
  opacity: .16;
  transition: opacity .25s;
}
.game-card:hover { transform: translateY(-4px); border-color: var(--accent, #5b46ff); box-shadow: var(--shadow); }
.game-card:hover::before { opacity: .28; }
.game-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.gc-top { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.gc-icon {
  width: 54px; height: 54px; border-radius: 14px;
  display: grid; place-items: center;
  font-size: 28px;
  background: linear-gradient(150deg, var(--accent) 0%, var(--accent-2) 100%);
  box-shadow: 0 10px 24px -8px var(--accent);
}
.gc-title { display: flex; flex-direction: column; }
.gc-title b { font-size: 19px; }
.gc-title span { font-size: 12px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
.gc-desc { color: var(--muted); font-size: 13.5px; line-height: 1.6; margin: 0 0 14px; min-height: 44px; }
.gc-foot { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; }
.gc-best { color: var(--muted); }
.gc-best b { color: var(--accent); font-size: 15px; }
.gc-play { color: var(--accent); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }

/* ---------- 通用游戏界面 ---------- */
.screen { animation: fade .35s var(--ease); }
@keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.game-head {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 14px;
  flex-wrap: wrap; row-gap: 10px;
}
.game-head h2 { white-space: nowrap; }
.back-btn {
  background: var(--panel); border: 1px solid var(--line); color: var(--text);
  border-radius: 12px; padding: 9px 14px; cursor: pointer; font-size: 14px;
  display: inline-flex; align-items: center; gap: 6px; transition: background .2s, transform .15s;
}
.back-btn:hover { background: var(--panel-2); transform: translateX(-2px); }
.game-head h2 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 8px; }
.game-head .spacer { flex: 1; }

.stat-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.pill b { color: var(--text); font-variant-numeric: tabular-nums; }
.pill.accent b { color: var(--accent); }

.panel {
  background: linear-gradient(160deg, var(--panel) 0%, var(--bg-soft) 100%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: clamp(16px, 3vw, 26px);
}
.hint { color: var(--muted); font-size: 13.5px; line-height: 1.65; margin: 0 0 16px; }
.hint b { color: var(--text); }

/* 折叠式玩法说明：目标常驻，规则点开 */
.howto { margin: 0 0 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg-soft); }
.howto > summary { list-style: none; cursor: pointer; padding: 13px 16px; display: flex; align-items: center; gap: 12px; }
.howto > summary::-webkit-details-marker { display: none; }
.howto > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 14px; }
.howto-goal { flex: 1; color: var(--text); font-weight: 600; font-size: 14.5px; line-height: 1.5; }
.howto-more { color: var(--accent); font-size: 12.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.howto-more::after { content: "▾"; }
.howto[open] .howto-more::after { content: "▴"; }
.howto-body { padding: 2px 16px 15px; color: var(--muted); font-size: 13.5px; line-height: 1.75; }
.howto-body b { color: var(--text); }

.palette-label { text-align: center; color: var(--muted); font-size: 13px; margin: 4px 0 10px; }

.btn {
  border: none; border-radius: 12px; padding: 12px 20px; cursor: pointer;
  font-size: 15px; font-weight: 600; color: #fff;
  background: linear-gradient(150deg, var(--accent) 0%, var(--accent-2) 100%);
  box-shadow: 0 10px 22px -10px var(--accent);
  transition: transform .15s var(--ease), filter .2s, opacity .2s;
}
.btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; transform: none; }
.btn.ghost { background: var(--panel-2); box-shadow: none; color: var(--text); border: 1px solid var(--line); }

.center { text-align: center; }
.mt { margin-top: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }

.toast {
  position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
  padding: 12px 20px; border-radius: 12px; font-size: 14px; z-index: 50;
  opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; box-shadow: var(--shadow);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============================================================
   1) 推理 · 密码破译 (Mastermind)
   ============================================================ */
.mm-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.mm-board { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.mm-row {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-soft); border: 1px solid var(--line);
  border-radius: 14px; padding: 8px 12px;
}
.mm-row.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.mm-idx { width: 22px; text-align: center; color: var(--muted-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.mm-pegs { display: flex; gap: 8px; }
.peg {
  width: 38px; height: 38px; border-radius: 50%;
  border: 2px solid var(--ring);
  background: var(--panel-2);
  display: grid; place-items: center; cursor: default;
  transition: transform .15s;
}
.mm-row.current .peg { cursor: pointer; width: 46px; height: 46px; }
.mm-row.current .peg:hover { transform: scale(1.06); }
.mm-row.current .peg.color-empty { border-style: dashed; }
.peg.sel { box-shadow: 0 0 0 3px rgba(255,255,255,.15); }
.mm-feedback { margin-left: auto; display: grid; grid-template-columns: repeat(2, 12px); grid-auto-rows: 12px; gap: 3px; }
.fb-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line); }
.fb-dot.exact { background: var(--peg-mark); border-color: var(--peg-mark); }
.fb-dot.color { background: transparent; border-color: var(--peg-mark); }

.palette { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 14px; }
.swatch {
  width: 52px; height: 52px; border-radius: 14px; cursor: pointer; border: 2px solid var(--ring);
  transition: transform .12s, box-shadow .2s;
}
.swatch:hover { transform: translateY(-2px) scale(1.05); }
.swatch:active { transform: translateY(0) scale(.94); }

.color-0 { background: #ff5d6c; } .color-1 { background: #ffb020; }
.color-2 { background: #ffe45e; } .color-3 { background: #2fd39a; }
.color-4 { background: #40c4ff; } .color-5 { background: #b388ff; }
.color-6 { background: #ff79c6; } /* 困难模式第 7 色 */
.color-empty { background: var(--panel-2); }

/* ============================================================
   2) 思维 · 数列推理
   ============================================================ */
.seq-display {
  font-size: clamp(24px, 6vw, 40px); font-weight: 800; text-align: center;
  letter-spacing: 2px; margin: 10px 0 6px; font-variant-numeric: tabular-nums;
  min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap;
}
.seq-q { color: var(--accent); }
.seq-sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.seq-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.seq-opt {
  background: var(--bg-soft); border: 1.5px solid var(--line); color: var(--text);
  border-radius: 14px; padding: 18px; font-size: 22px; font-weight: 700; cursor: pointer;
  font-variant-numeric: tabular-nums; transition: transform .12s, border-color .2s, background .2s;
}
.seq-opt:hover { border-color: var(--accent); transform: translateY(-2px); }
.seq-opt.correct { background: rgba(53, 208, 127, .18); border-color: var(--good); }
.seq-opt.wrong { background: rgba(255, 93, 108, .16); border-color: var(--bad); }
.seq-opt:disabled { cursor: default; }

.timebar { height: 8px; background: var(--panel-2); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
.timebar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .1s linear; }

/* ============================================================
   3) 反应 · 极速反应
   ============================================================ */
.react-arena {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  max-height: 62vh;
  background: radial-gradient(circle at 50% 40%, #12162b 0%, #0c0f1e 100%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  user-select: none;
  touch-action: manipulation;
}
.react-arena.wait { cursor: pointer; }
.react-center {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px;
  color: var(--arena-text);
}
.react-center h3 { margin: 0 0 6px; font-size: clamp(20px, 5vw, 30px); }
.react-center p { margin: 4px 0; color: rgba(238, 241, 255, .7); font-size: 14px; }
.react-big { font-size: clamp(34px, 9vw, 64px); font-weight: 800; font-variant-numeric: tabular-nums; }
.react-arena.state-ready { background: radial-gradient(circle at 50% 45%, #3a2a12 0%, #241608 100%); }
.react-arena.state-go { background: radial-gradient(circle at 50% 45%, #123821 0%, #0a2716 100%); }
.react-arena.state-early { background: radial-gradient(circle at 50% 45%, #3a1420 0%, #260a12 100%); }

.target {
  position: absolute;
  width: 66px; height: 66px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff6d8, var(--reaction) 55%, var(--reaction-2));
  box-shadow: 0 0 0 6px rgba(255, 176, 32, .18), 0 8px 30px rgba(255, 122, 26, .4);
  display: grid; place-items: center; cursor: pointer;
  transform: translate(-50%, -50%) scale(0);
  animation: pop .18s var(--ease) forwards;
}
@keyframes pop { to { transform: translate(-50%, -50%) scale(1); } }
.target::after { content: "⚡"; font-size: 26px; }

/* ============================================================
   4) 维度 · 空间旋转
   ============================================================ */
.sp-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.sp-ref { text-align: center; }
.sp-ref .label { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.sp-canvas {
  background: var(--bg-soft); border: 1.5px solid var(--line); border-radius: 16px;
  display: block;
}
.sp-ref .sp-canvas { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.sp-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: 100%; max-width: 420px; }
.sp-option {
  padding: 8px; border-radius: 16px; background: transparent; border: none; cursor: pointer;
  display: grid; place-items: center; transition: transform .12s;
}
.sp-option:hover .sp-canvas { border-color: var(--accent); }
.sp-option:hover { transform: translateY(-2px); }
.sp-option.correct .sp-canvas { border-color: var(--good); box-shadow: 0 0 0 2px var(--good); }
.sp-option.wrong .sp-canvas { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad); }
.sp-option:disabled { cursor: default; }

/* ---------- 结算 ---------- */
.result-card { text-align: center; padding: 8px 0; }
.result-emoji { font-size: 54px; }
.result-card h3 { font-size: 24px; margin: 8px 0 4px; }
.result-card .big-num { font-size: 46px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.result-card .sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
.new-best { display: inline-block; background: linear-gradient(150deg, var(--accent), var(--accent-2)); color: #fff; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; margin-bottom: 12px; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

/* ---------- 难度分段控件 ---------- */
.diffbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.diffbar-label { color: var(--muted); font-size: 13px; margin-right: 2px; }
.diff-seg {
  background: var(--panel); border: 1px solid var(--line); color: var(--muted);
  border-radius: 999px; padding: 7px 16px; cursor: pointer; font-size: 13.5px; font-weight: 600;
  transition: color .18s, background .18s, border-color .18s, box-shadow .18s;
}
.diff-seg:hover { color: var(--text); border-color: var(--accent); }
.diff-seg.active { color: #fff; background: linear-gradient(150deg, var(--accent), var(--accent-2)); border-color: transparent; box-shadow: 0 8px 18px -10px var(--accent); }

/* ---------- featured 卡片（综合游戏，通栏） ---------- */
.game-card.featured { grid-column: 1 / -1; }
@media (max-width: 560px) { .game-card.featured { grid-column: auto; } }

/* ---------- 5) 综合 · 舒尔特方格 ---------- */
.schulte-grid {
  position: relative;
  display: grid;
  grid-auto-rows: 1fr;
  gap: 8px;
  width: 100%;
  max-width: 460px;
  margin: 4px auto 0;
  aspect-ratio: 1 / 1;
}
.schulte-cell {
  border: 1.5px solid var(--line);
  background: var(--bg-soft);
  color: var(--text);
  border-radius: 12px;
  font-size: clamp(18px, 5vw, 28px);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  display: grid; place-items: center;
  transition: background .15s, transform .08s, border-color .15s, opacity .2s;
  user-select: none;
}
.schulte-cell:hover { border-color: var(--accent); }
.schulte-cell:active { transform: scale(.94); }
.schulte-cell.done {
  background: linear-gradient(150deg, var(--accent), var(--accent-2));
  color: #fff; border-color: transparent; opacity: .45; cursor: default;
}
.schulte-cell.shake { animation: shake .3s; border-color: var(--bad); }
@keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }
.schulte-overlay {
  position: absolute; inset: 0;
  background: var(--overlay-bg);
  backdrop-filter: blur(3px);
  border-radius: var(--radius);
  display: grid; place-items: center; text-align: center;
  z-index: 3;
}
.schulte-overlay h3 { margin: 0 0 6px; font-size: 22px; }
.schulte-overlay p { margin: 0 0 4px; color: var(--muted); font-size: 14px; }

/* ============================================================
   浅色主题（由 <html data-theme="light"> 驱动）
   ============================================================ */
:root[data-theme="light"] {
  --bg: #eef1f8;
  --bg-soft: #ffffff;
  --panel: #ffffff;
  --panel-2: #eef1f8;
  --line: #dbe0ee;
  --text: #1b2138;
  --muted: #5c6486;
  --muted-2: #8991af;

  --ring: rgba(20, 26, 54, .16);
  --peg-mark: #1b2138;
  --shadow: 0 18px 45px rgba(38, 50, 90, .16);
  /* 反应区与舒尔特开始遮罩保持深色，文字用固定浅色 —— 变量维持默认深色值 */
}
:root[data-theme="light"] body {
  background: radial-gradient(1200px 800px at 15% -10%, #e6ecfb 0%, var(--bg) 55%),
              radial-gradient(900px 700px at 110% 10%, #eaf0ff 0%, transparent 60%),
              var(--bg);
}
:root[data-theme="light"] .bg-orbs { opacity: .22; }
:root[data-theme="light"] .brand-logo { filter: drop-shadow(0 4px 10px rgba(91, 70, 255, .3)); }
/* 浅色下正误提示底色略加深以保证可读 */
:root[data-theme="light"] .seq-opt.correct { background: rgba(23, 168, 119, .16); }
:root[data-theme="light"] .seq-opt.wrong { background: rgba(255, 93, 108, .14); }

/* ============================================================
   能力总览 · 雷达图 + 成绩明细
   ============================================================ */
:root { --profile: #8b90ff; --radar-grid: rgba(150, 160, 200, .22); }
:root[data-theme="light"] { --profile: #5b46ff; --radar-grid: rgba(80, 90, 130, .24); }

.stats-hero { display: flex; flex-direction: column; align-items: center; }
.radar-canvas { width: 340px; max-width: 100%; aspect-ratio: 1 / 1; display: block; }
.stats-score { text-align: center; margin-top: 2px; }
.stats-score .num { font-size: 46px; font-weight: 800; color: var(--profile); font-variant-numeric: tabular-nums; line-height: 1; }
.stats-score .rank { color: var(--muted); font-size: 14.5px; margin-top: 5px; }
.stats-note { color: var(--muted-2); font-size: 12px; text-align: center; margin-top: 12px; max-width: 380px; line-height: 1.5; }

.stats-table-wrap { overflow-x: auto; margin-top: 22px; }
.stats-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 380px; }
.stats-table th, .stats-table td { padding: 11px 12px; text-align: center; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stats-table thead th { color: var(--muted); font-weight: 600; font-size: 12px; letter-spacing: .5px; }
.stats-table td:first-child, .stats-table th:first-child { text-align: left; }
.stats-table tbody tr:last-child td { border-bottom: none; }
.stats-table .mod { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.stats-table .mod .i { font-size: 18px; }
.stats-empty { text-align: center; padding: 16px 8px; }

/* 窄屏隐藏品牌副标题，避免头部换行 */
@media (max-width: 480px) { .brand-text small { display: none; } .header-actions { gap: 8px; } }

</style>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
  <script>
    /* 首帧前应用主题，避免闪烁 */
    try {
      var _t = localStorage.getItem("na_theme");
      _t = _t ? JSON.parse(_t) : (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", _t);
    } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
  </script>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <header class="app-header">
    <div class="brand" id="brand-home" role="button" tabindex="0" title="返回首页">
      <span class="brand-logo">🧠</span>
      <span class="brand-text">
        <strong>脑力训练场</strong>
        <small>NeuroArena · 推理 · 思维 · 反应 · 维度</small>
      </span>
    </div>
    <div class="header-actions">
      <button id="stats-btn" class="icon-btn" title="能力总览" aria-label="能力总览">📊</button>
      <button id="theme-toggle" class="icon-btn" title="切换深色/浅色" aria-label="切换主题">🌙</button>
      <button id="sound-toggle" class="icon-btn" title="开/关音效" aria-label="切换音效">🔊</button>
    </div>
  </header>

  <main id="app" class="app-main">
    <!-- 各界面由 app.js 动态渲染 -->
  </main>

  <footer class="app-footer">
    <span>用键盘 / 触屏均可游玩 · 成绩自动保存在本地</span>
  </footer>

  <script>
/* ============================================================
   脑力训练场 · NeuroArena
   纯原生 JS · 无依赖 · 直接打开 index.html 即可游玩
   五个训练模块：推理 / 思维 / 反应 / 维度 / 综合(舒尔特)
   每个模块支持 简单 / 普通 / 困难 三档难度，成绩分档保存
   ============================================================ */
(function () {
  "use strict";

  /* -------------------- 通用工具 -------------------- */
  const app = document.getElementById("app");

  // 迷你 DOM 构建器：h("div", {class:"x", onclick:fn}, child1, child2...)
  function h(tag, props, ...children) {
    const el = document.createElement(tag);
    if (props) {
      for (const k in props) {
        const v = props[k];
        if (v == null || v === false) continue;
        if (k === "class") el.className = v;
        else if (k === "html") el.innerHTML = v;
        else if (k === "style" && typeof v === "object") { for (const p in v) { if (p.startsWith("--")) el.style.setProperty(p, v[p]); else el.style[p] = v[p]; } }
        else if (k.startsWith("on") && typeof v === "function")
          el.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k in el && k !== "list") { try { el[k] = v; } catch (_) { el.setAttribute(k, v); } }
        else el.setAttribute(k, v);
      }
    }
    for (const c of children.flat()) {
      if (c == null || c === false) continue;
      el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(c) : c);
    }
    return el;
  }

  const rand = (n) => Math.floor(Math.random() * n);
  const pick = (arr) => arr[rand(arr.length)];
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };

  /* -------------------- 本地存储 -------------------- */
  const Store = {
    get(key, def) { try { const v = localStorage.getItem("na_" + key); return v == null ? def : JSON.parse(v); } catch (_) { return def; } },
    set(key, val) { try { localStorage.setItem("na_" + key, JSON.stringify(val)); } catch (_) {} },
  };

  /* -------------------- 难度系统 -------------------- */
  const DIFFS = [{ id: "easy", name: "简单" }, { id: "normal", name: "普通" }, { id: "hard", name: "困难" }];
  const diffName = (id) => (DIFFS.find((d) => d.id === id) || DIFFS[1]).name;
  const getDiff = (gameId) => Store.get("diff." + gameId, "normal");
  const setDiff = (gameId, d) => Store.set("diff." + gameId, d);
  const bestKey = (gameId, d) => "best." + gameId + "." + d;
  const getBest = (gameId, d) => Store.get(bestKey(gameId, d), null);
  // 记录成绩：lowerBetter=true 时越小越好，返回 {isBest, best}
  function recordBest(gameId, d, value, lowerBetter) {
    const cur = getBest(gameId, d);
    const isBest = cur == null || (lowerBetter ? value < cur : value > cur);
    if (isBest) Store.set(bestKey(gameId, d), value);
    return { isBest, best: getBest(gameId, d) };
  }

  /* -------------------- 音效（WebAudio，无需素材） -------------------- */
  const Sound = {
    ctx: null,
    on: Store.get("sound", true),
    ensure() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } return this.ctx; },
    beep(freq, dur, type, gain) {
      if (!this.on) return;
      const ctx = this.ensure(); if (!ctx) return;
      if (ctx.state === "suspended") ctx.resume();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.value = gain || 0.06;
      o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime;
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.12));
      o.start(t); o.stop(t + (dur || 0.12));
    },
    click() { this.beep(520, 0.06, "triangle"); },
    good() { this.beep(660, 0.09, "sine"); setTimeout(() => this.beep(880, 0.12, "sine"), 70); },
    bad() { this.beep(180, 0.2, "sawtooth", 0.05); },
    win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.beep(f, 0.14, "triangle"), i * 90)); },
    pop() { this.beep(760, 0.05, "square", 0.05); },
  };

  const soundBtn = document.getElementById("sound-toggle");
  function refreshSoundBtn() { soundBtn.textContent = Sound.on ? "🔊" : "🔈"; soundBtn.classList.toggle("muted", !Sound.on); }
  soundBtn.addEventListener("click", () => { Sound.on = !Sound.on; Store.set("sound", Sound.on); refreshSoundBtn(); if (Sound.on) Sound.click(); });
  refreshSoundBtn();

  /* -------------------- 主题（深色 / 浅色） -------------------- */
  const root = document.documentElement;
  const Theme = {
    get() { return root.getAttribute("data-theme") === "light" ? "light" : "dark"; },
    set(t) { root.setAttribute("data-theme", t); Store.set("theme", t); refreshThemeBtn(); themeRedraws.forEach((fn) => { try { fn(); } catch (_) {} }); },
    toggle() { this.set(this.get() === "dark" ? "light" : "dark"); },
  };
  const themeBtn = document.getElementById("theme-toggle");
  function refreshThemeBtn() { themeBtn.textContent = Theme.get() === "light" ? "☀️" : "🌙"; themeBtn.title = Theme.get() === "light" ? "切换到深色" : "切换到浅色"; }
  // 若首帧脚本未设置（如内联到无 head 的环境），此处兜底
  if (!root.getAttribute("data-theme")) {
    const stored = Store.get("theme", null);
    root.setAttribute("data-theme", stored || (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
  }
  themeBtn.addEventListener("click", () => { Theme.toggle(); Sound.click(); });
  refreshThemeBtn();

  /* -------------------- 轻量提示 toast -------------------- */
  let toastEl, toastTimer;
  function toast(msg) {
    if (!toastEl) { toastEl = h("div", { class: "toast" }); document.body.appendChild(toastEl); }
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
  }

  /* -------------------- 路由 -------------------- */
  let currentGame = null;
  let themeRedraws = []; // 主题切换时需要重绘的回调（如雷达图 canvas），每次导航清空
  function leaveGame() { if (currentGame && currentGame.teardown) { try { currentGame.teardown(); } catch (_) {} } currentGame = null; }
  function mount(node) { leaveGame(); themeRedraws = []; app.innerHTML = ""; app.appendChild(node); window.scrollTo(0, 0); }
  function goHome() { mount(renderHome()); }
  document.getElementById("brand-home").addEventListener("click", goHome);
  document.getElementById("brand-home").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") goHome(); });
  document.getElementById("stats-btn").addEventListener("click", () => { Sound.click(); showStats(); });

  const accentVars = (name) => ({ "--accent": `var(--${name})`, "--accent-2": `var(--${name}-2)` });

  /* -------------------- 游戏元信息 -------------------- */
  const GAMES = [
    { id: "reason", icon: "🧩", name: "密码破译", tag: "REASONING", skill: "推理", accent: "reason",
      desc: "根据每次反馈，一步步演绎出隐藏的颜色密码。锻炼逻辑演绎与假设检验。",
      lowerBetter: true, bestLabel: (v) => v + " 步", start: startReason },
    { id: "logic", icon: "🧠", name: "数列推理", tag: "LOGIC", skill: "思维", accent: "logic",
      desc: "在限定时间内找出数字规律，选出下一项。锻炼归纳、抽象与逻辑思维。",
      lowerBetter: false, bestLabel: (v) => v + " 分", start: startLogic },
    { id: "reaction", icon: "⚡", name: "极速反应", tag: "REACTION", skill: "反应", accent: "reaction",
      desc: "目标出现的瞬间立即点击，测量你的平均反应速度（毫秒）。抢跑无效！",
      lowerBetter: true, bestLabel: (v) => v + " ms", start: startReaction },
    { id: "spatial", icon: "🔷", name: "空间旋转", tag: "SPATIAL", skill: "维度", accent: "spatial",
      desc: "判断哪个图形是参考图形旋转后的样子（小心镜像陷阱）。锻炼空间想象与心理旋转。",
      lowerBetter: false, bestLabel: (v) => v + " 分", start: startSpatial },
    { id: "schulte", icon: "🔢", name: "舒尔特方格", tag: "ATTENTION", skill: "综合", accent: "schulte", featured: true,
      desc: "在乱序方格中，按 1→N 顺序依次点击，用时越短越好。综合锻炼反应、专注、空间注意与视觉搜索。",
      lowerBetter: true, bestLabel: (v) => (v / 1000).toFixed(1) + " 秒", start: startSchulte },
  ];
  const meta = (id) => GAMES.find((g) => g.id === id);

  /* ==========================================================
     首页
     ========================================================== */
  function renderHome() {
    const cards = GAMES.map((g) => {
      const d = getDiff(g.id), b = getBest(g.id, d);
      return h("button", { class: "game-card" + (g.featured ? " featured" : ""), style: accentVars(g.accent),
        onclick: () => { Sound.click(); g.start(getDiff(g.id)); } },
        h("div", { class: "gc-top" },
          h("div", { class: "gc-icon" }, g.icon),
          h("div", { class: "gc-title" }, h("b", null, g.name), h("span", null, g.skill + " · " + g.tag))
        ),
        h("p", { class: "gc-desc" }, g.desc),
        h("div", { class: "gc-foot" },
          h("span", { class: "gc-best" }, b == null ? "尚无记录" : ["最佳 ", h("b", null, g.bestLabel(b)), " · " + diffName(d)]),
          h("span", { class: "gc-play" }, "开始 ▶")
        )
      );
    });
    return h("section", { class: "screen" },
      h("div", { class: "home-intro" },
        h("h1", null, "选择你的训练"),
        h("p", null, "五个模块 · 三档难度 · 逐一挑战，或每天全部过一遍。祝你脑力更上一层楼 🚀")
      ),
      h("div", { class: "card-grid" }, cards)
    );
  }

  /* -------------------- 游戏外壳 -------------------- */
  // diffBar: 难度分段控件，切换即以新难度重开本游戏
  function diffBar(game, curDiff) {
    const bar = h("div", { class: "diffbar" }, h("span", { class: "diffbar-label" }, "难度"));
    DIFFS.forEach((d) => {
      bar.appendChild(h("button", {
        class: "diff-seg" + (d.id === curDiff ? " active" : ""),
        onclick: () => { if (d.id === curDiff) return; Sound.click(); setDiff(game.id, d.id); game.start(d.id); },
      }, d.name));
    });
    return bar;
  }

  function gameShell(game, curDiff, pills) {
    const head = h("div", { class: "game-head" },
      h("button", { class: "back-btn", onclick: () => { Sound.click(); goHome(); } }, "‹ 返回"),
      h("h2", null, game.icon + " " + game.name),
      h("div", { class: "spacer" }),
      h("div", { class: "stat-pills" }, pills || [])
    );
    const panel = h("div", { class: "panel" });
    const section = h("section", { class: "screen", style: accentVars(game.accent) }, head, diffBar(game, curDiff), panel);
    return { section, panel, head };
  }

  function bestPillEl(game, diff) {
    const b = getBest(game.id, diff);
    return h("div", { class: "pill accent" }, "最佳 ", h("b", null, b == null ? "—" : game.bestLabel(b)));
  }

  // 折叠式玩法说明：一句话目标常驻，详细规则点开才显示（默认收起，减少一屏文字）
  function howto(goal, ...detail) {
    return h("details", { class: "howto" },
      h("summary", null, h("span", { class: "howto-goal" }, goal), h("span", { class: "howto-more" }, "玩法说明")),
      h("div", { class: "howto-body" }, ...detail));
  }

  // 通用结算卡
  function resultCard(opts) {
    return h("div", { class: "result-card" },
      h("div", { class: "result-emoji" }, opts.emoji),
      opts.isBest ? h("div", { class: "new-best" }, "新纪录！") : null,
      h("h3", null, opts.title),
      opts.big != null ? h("div", { class: "big-num" }, opts.big) : null,
      h("div", { class: "sub" }, opts.sub),
      opts.extra || null,
      h("div", { class: "row center" },
        h("button", { class: "btn", onclick: opts.onRetry }, "再来一局"),
        h("button", { class: "btn ghost", onclick: goHome }, "返回首页"))
    );
  }

  /* ==========================================================
     1) 推理 · 密码破译（Mastermind）
     ========================================================== */
  const REASON_CFG = {
    easy: { colors: 6, slots: 4, tries: 12 },
    normal: { colors: 6, slots: 4, tries: 10 },
    hard: { colors: 7, slots: 5, tries: 10 },
  };
  function startReason(diff) {
    diff = diff || getDiff("reason");
    const game = meta("reason");
    const cfg = REASON_CFG[diff], COLORS = cfg.colors, SLOTS = cfg.slots, MAX_TRIES = cfg.tries;
    const secret = Array.from({ length: SLOTS }, () => rand(COLORS));

    let attempt = 0, current = Array(SLOTS).fill(-1), done = false;
    const history = [];

    const triesPill = h("div", { class: "pill" }, "剩余 ", h("b", null, String(MAX_TRIES)));
    const bp = bestPillEl(game, diff);
    const shell = gameShell(game, diff, [triesPill, bp]);

    const boardEl = h("div", { class: "mm-board" });
    const paletteEl = h("div", { class: "palette" });
    const submitBtn = h("button", { class: "btn", disabled: true, onclick: submit }, "确认这一行");
    const statusEl = h("div", { class: "center mt", style: { minHeight: "24px", color: "var(--muted)" } });

    shell.panel.appendChild(howto(
      "点下方颜色依次填入这一行 → 点「确认」，按提示推出密码",
      "密码由 ", h("b", null, SLOTS + " 个颜色"), " 组成（可重复，共 " + COLORS + " 种）。每次确认后，右侧给出提示：",
      h("b", null, "●实心"), " = 有一处颜色和位置都对；",
      h("b", null, "○空心"), " = 有一处颜色对但位置不对。共 ", h("b", null, String(MAX_TRIES)), " 次机会。点已填的圆点可清除重填。"));
    shell.panel.appendChild(boardEl);
    shell.panel.appendChild(h("div", { class: "palette-label" }, "👇 点颜色填入"));
    shell.panel.appendChild(paletteEl);
    shell.panel.appendChild(h("div", { class: "row center mt" }, submitBtn, h("button", { class: "btn ghost", onclick: clearRow }, "清空")));
    shell.panel.appendChild(statusEl);

    function buildPalette() {
      paletteEl.innerHTML = "";
      for (let c = 0; c < COLORS; c++)
        paletteEl.appendChild(h("div", { class: "swatch color-" + c, title: "填入颜色 " + (c + 1), onclick: () => fillNext(c) }));
    }
    function renderBoard() {
      boardEl.innerHTML = "";
      // 只渲染「已猜的历史 + 当前这一行」，避免一上来就是 10 行空格把调色板挤到屏幕外
      const rowCount = done ? attempt : attempt + 1;
      for (let r = 0; r < rowCount; r++) {
        const isCurrent = r === attempt && !done;
        const row = h("div", { class: "mm-row" + (isCurrent ? " current" : "") }, h("div", { class: "mm-idx" }, String(r + 1)));
        const pegs = h("div", { class: "mm-pegs" });
        const gd = history[r];
        for (let s = 0; s < SLOTS; s++) {
          const colorIdx = gd ? gd.guess[s] : (isCurrent ? current[s] : -1);
          pegs.appendChild(h("div", { class: "peg " + (colorIdx >= 0 ? "color-" + colorIdx : "color-empty"), onclick: isCurrent ? () => clearSlot(s) : null }));
        }
        row.appendChild(pegs);
        const fb = h("div", { class: "mm-feedback" });
        if (gd) {
          for (let i = 0; i < gd.exact; i++) fb.appendChild(h("div", { class: "fb-dot exact" }));
          for (let i = 0; i < gd.color; i++) fb.appendChild(h("div", { class: "fb-dot color" }));
          for (let i = 0; i < SLOTS - gd.exact - gd.color; i++) fb.appendChild(h("div", { class: "fb-dot" }));
        } else for (let i = 0; i < SLOTS; i++) fb.appendChild(h("div", { class: "fb-dot" }));
        row.appendChild(fb);
        boardEl.appendChild(row);
      }
    }
    function fillNext(c) { if (done) return; const i = current.indexOf(-1); if (i < 0) return; current[i] = c; Sound.click(); updateSubmit(); renderBoard(); }
    function clearSlot(s) { if (done || current[s] < 0) return; current[s] = -1; Sound.click(); updateSubmit(); renderBoard(); }
    function clearRow() { if (done) return; current = Array(SLOTS).fill(-1); updateSubmit(); renderBoard(); }
    function updateSubmit() { submitBtn.disabled = current.some((c) => c < 0); }
    function evaluate(guess) {
      let exact = 0, color = 0; const sc = {}, gc = {};
      for (let i = 0; i < SLOTS; i++) { if (guess[i] === secret[i]) exact++; else { sc[secret[i]] = (sc[secret[i]] || 0) + 1; gc[guess[i]] = (gc[guess[i]] || 0) + 1; } }
      for (const c in gc) if (sc[c]) color += Math.min(sc[c], gc[c]);
      return { exact, color };
    }
    function submit() {
      if (done || current.some((c) => c < 0)) return;
      const res = evaluate(current);
      history[attempt] = { guess: current.slice(), exact: res.exact, color: res.color };
      attempt++; triesPill.querySelector("b").textContent = String(MAX_TRIES - attempt);
      if (res.exact === SLOTS) win();
      else if (attempt >= MAX_TRIES) lose();
      else { Sound.click(); current = Array(SLOTS).fill(-1); updateSubmit(); renderBoard(); }
    }
    function endUI(node) { paletteEl.style.display = "none"; submitBtn.parentElement.style.display = "none"; statusEl.innerHTML = ""; statusEl.appendChild(node); }
    function win() {
      done = true; Sound.win(); renderBoard();
      const steps = attempt, rec = recordBest("reason", diff, steps, true);
      if (rec.isBest) bp.querySelector("b").textContent = game.bestLabel(steps);

  const LOGIC_CFG = {

  // 每个生成器返回 {seq:[5项], answer, note}

    arith() { const s = rand(9) + 1, d = pick([2, 3, 4, 5, 6, 7, -2, -3, -4]); const seq = []; for (let i = 0; i < 5; i++) seq.push(s + d * i); return { seq, answer: s + d * 5, note: "等差数列" }; },
    geoS() { const s = rand(3) + 1; const seq = []; for (let i = 0; i < 5; i++) seq.push(s * Math.pow(2, i)); return { seq, answer: s * Math.pow(2, 5), note: "等比数列（×2）" }; },
    geo() { const s = rand(3) + 1, r = pick([2, 3]); const seq = []; for (let i = 0; i < 5; i++) seq.push(s * Math.pow(r, i)); return { seq, answer: s * Math.pow(r, 5), note: "等比数列（×" + r + "）" }; },

  /* ==========================================================
     4) 维度 · 空间旋转（心理旋转）

  const SPATIAL_CFG = { easy: { size: 4 }, normal: { size: 5 }, hard: { size: 6 } };
  // 多连块几何工具
  const _key = (x, y) => x + "," + y;
  function normalizePoly(cells) {
    const minx = Math.min(...cells.map((c) => c[0])), miny = Math.min(...cells.map((c) => c[1]));
    return cells.map((c) => [c[0] - minx, c[1] - miny]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  }
  const rotPoly = (cells) => normalizePoly(cells.map(([x, y]) => [y, -x]));
  const mirPoly = (cells) => normalizePoly(cells.map(([x, y]) => [-x, y]));
  function canonPoly(cells) { let c = normalizePoly(cells), best = JSON.stringify(c); for (let i = 0; i < 3; i++) { c = rotPoly(c); const s = JSON.stringify(c); if (s < best) best = s; } return best; }
  const chiralPoly = (cells) => canonPoly(cells) !== canonPoly(mirPoly(cells));
  function randomPoly(size) {
    const cells = [[0, 0]], set = new Set([_key(0, 0)]), dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    while (cells.length < size) { const b = pick(cells), d = pick(dirs), nx = b[0] + d[0], ny = b[1] + d[1]; if (!set.has(_key(nx, ny))) { set.add(_key(nx, ny)); cells.push([nx, ny]); } }
    return normalizePoly(cells);
  }
  function rotN(cells, n) { let c = normalizePoly(cells); for (let i = 0; i < ((n % 4) + 4) % 4; i++) c = rotPoly(c); return c; }
  function drawShape(cells, size, colorVar) {
    const cv = h("canvas", { class: "sp-canvas", width: size, height: size }), ctx = cv.getContext("2d");
    const gw = Math.max(...cells.map((c) => c[0])) + 1, gh = Math.max(...cells.map((c) => c[1])) + 1, pad = 14;
    const cell = Math.floor(Math.min((size - pad * 2) / gw, (size - pad * 2) / gh));
    const offx = (size - cell * gw) / 2, offy = (size - cell * gh) / 2;
    const grad = ctx.createLinearGradient(0, 0, size, size); grad.addColorStop(0, colorVar[0]); grad.addColorStop(1, colorVar[1]);
    cells.forEach(([x, y]) => { const px = offx + x * cell, py = offy + y * cell; ctx.fillStyle = grad; ctx.fillRect(px + 1, py + 1, cell - 2, cell - 2); ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1.5; ctx.strokeRect(px + 1.5, py + 1.5, cell - 3, cell - 3); });
    return cv;
  }
  function startSpatial(diff) {

      "选出参考图「旋转后」的那个（避开镜像陷阱）",

    nums.forEach((val) => {

        h("button", { class: "btn mt", onclick: start }, "开始 ▶")));

        onRetry: () => startSchulte(diff) }));
    }
    mount(shell.section);
    currentGame = { teardown() { clearInterval(tickTimer); } };
  }

  /* ==========================================================
     能力总览 · 五维雷达图 + 成绩明细
     ========================================================== */
  // 把各模块最佳成绩折算成 0–100 的“能力值”（相对参考，越大越强）
  const ABILITY = {
    reason: (v) => clamp(Math.round(110 - v * 10), 5, 100),      // 步数越少越强
    logic: (v) => clamp(Math.round(v / 2), 0, 100),             // 得分越高越强
    reaction: (v) => clamp(Math.round((520 - v) / 2.7), 0, 100), // 毫秒越小越强
    spatial: (v) => clamp(Math.round(v / 2), 0, 100),
    schulte: (v) => clamp(Math.round((16000 - v) / 140), 0, 100), // 毫秒越小越强
  };
  function bestAcross(g) { // 取跨难度的最佳（对“越小越好”取最小，否则取最大）
    const vals = DIFFS.map((d) => getBest(g.id, d.id)).filter((v) => v != null);
    if (!vals.length) return null;
    return g.lowerBetter ? Math.min(...vals) : Math.max(...vals);
  }
  function rankOf(s) {
    return s >= 90 ? { t: "大师", e: "🏆" } : s >= 75 ? { t: "专家", e: "🌟" }
      : s >= 55 ? { t: "高手", e: "🔥" } : s >= 35 ? { t: "熟练", e: "💪" }
      : s >= 15 ? { t: "入门", e: "🌱" } : { t: "见习", e: "🐣" };
  }
  function hexA(hex, a) {
    hex = hex.replace("#", "");
    if (hex.length === 3) hex = hex.split("").map((c) => c + c).join("");
    const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }
  function drawRadar(canvas, data) {
    const dpr = window.devicePixelRatio || 1;
    const size = canvas.clientWidth || 320;
    canvas.width = size * dpr; canvas.height = size * dpr;
    const ctx = canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    const cx = size / 2, cy = size / 2, R = size / 2 - 62, n = data.length;
    const cs = getComputedStyle(document.documentElement);
    const grid = cs.getPropertyValue("--radar-grid").trim() || "rgba(150,160,200,.22)";
    const textCol = cs.getPropertyValue("--text").trim() || "#eee";
    const accent = cs.getPropertyValue("--profile").trim() || "#8b90ff";
    const ringCol = cs.getPropertyValue("--bg-soft").trim() || "#111";
    const fam = getComputedStyle(document.body).fontFamily;
    const ang = (i) => -Math.PI / 2 + i * 2 * Math.PI / n;
    ctx.lineWidth = 1; ctx.strokeStyle = grid;
    [20, 40, 60, 80, 100].forEach((lvl) => {
      ctx.beginPath();
      for (let i = 0; i < n; i++) { const r = R * lvl / 100, x = cx + Math.cos(ang(i)) * r, y = cy + Math.sin(ang(i)) * r; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.closePath(); ctx.stroke();
    });
    for (let i = 0; i < n; i++) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ang(i)) * R, cy + Math.sin(ang(i)) * R); ctx.stroke(); }
    ctx.beginPath();
    for (let i = 0; i < n; i++) { const r = R * data[i].value / 100, x = cx + Math.cos(ang(i)) * r, y = cy + Math.sin(ang(i)) * r; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.closePath(); ctx.fillStyle = hexA(accent, 0.22); ctx.fill(); ctx.strokeStyle = accent; ctx.lineWidth = 2; ctx.stroke();
    for (let i = 0; i < n; i++) {
      const r = R * data[i].value / 100, x = cx + Math.cos(ang(i)) * r, y = cy + Math.sin(ang(i)) * r;
      ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 7); ctx.fillStyle = accent; ctx.fill(); ctx.strokeStyle = ringCol; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.textBaseline = "middle";
    for (let i = 0; i < n; i++) {
      const a = ang(i), lx = cx + Math.cos(a) * (R + 16), ly = cy + Math.sin(a) * (R + 16), c = Math.cos(a);
      ctx.textAlign = Math.abs(c) < 0.35 ? "center" : (c > 0 ? "left" : "right");
      ctx.font = "600 12.5px " + fam; ctx.fillStyle = textCol; ctx.fillText(data[i].emoji + " " + data[i].label, lx, ly - 8);
      ctx.font = "800 12.5px " + fam; ctx.fillStyle = accent; ctx.fillText(String(data[i].value), lx, ly + 9);
    }
  }
  function showStats() {
    const data = GAMES.map((g) => { const raw = bestAcross(g); return { g, raw, value: raw == null ? 0 : ABILITY[g.id](raw) }; });
    const hasAny = data.some((d) => d.raw != null);
    const overall = hasAny ? Math.round(data.reduce((s, d) => s + d.value, 0) / data.length) : 0;
    const rk = rankOf(overall);

    const head = h("div", { class: "game-head" },
      h("button", { class: "back-btn", onclick: () => { Sound.click(); goHome(); } }, "‹ 返回"),
      h("h2", null, "📊 能力总览"), h("div", { class: "spacer" }));
    const panel = h("div", { class: "panel" });
    const section = h("section", { class: "screen", style: { "--accent": "var(--profile)", "--accent-2": "var(--profile)" } }, head, panel);

    if (!hasAny) {
      panel.appendChild(h("div", { class: "stats-empty" },
        h("div", { class: "result-emoji" }, "📊"),
        h("h3", { style: { margin: "8px 0 6px" } }, "还没有任何成绩"),
        h("p", { class: "hint", style: { textAlign: "center" } }, "先去玩几局，这里就会生成你的五维能力雷达图和最佳成绩明细。"),
        h("div", { class: "row center" }, h("button", { class: "btn", onclick: goHome }, "去训练 ▶"))));
      mount(section); currentGame = { teardown() {} }; return;
    }

    const canvas = h("canvas", { class: "radar-canvas", role: "img", "aria-label": "五维能力雷达图" });
    const radarData = data.map((d) => ({ label: d.g.skill, emoji: d.g.icon, value: d.value }));
    panel.appendChild(h("div", { class: "stats-hero" },
      canvas,
      h("div", { class: "stats-score" }, h("div", { class: "num" }, String(overall)), h("div", { class: "rank" }, rk.e + " " + rk.t + " · 综合能力")),
      h("div", { class: "stats-note" }, "能力值 0–100 为相对参考，取各模块历史最佳（跨难度）折算")));

    const rows = GAMES.map((g) => h("tr", null,
      h("td", null, h("span", { class: "mod" }, h("span", { class: "i" }, g.icon), g.name)),
      ...DIFFS.map((d) => { const b = getBest(g.id, d.id); return h("td", null, b == null ? "—" : g.bestLabel(b)); })));
    panel.appendChild(h("div", { class: "stats-table-wrap" },
      h("table", { class: "stats-table" },
        h("thead", null, h("tr", null, h("th", null, "模块"), ...DIFFS.map((d) => h("th", null, d.name)))),
        h("tbody", null, rows))));

    mount(section);
    const draw = () => drawRadar(canvas, radarData);
    draw(); themeRedraws.push(draw);
    currentGame = { teardown() {} };
  }

  /* -------------------- 启动 -------------------- */
  goHome();
})();

</script>
</body>
</html>
