<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f1220" />
  <title>脑力训练场 · NeuroArena</title>
  <meta name="description" content="2048 · 连线 · 扫雷 · 记忆翻牌 四合一经典小游戏合集" />

  <!-- PWA：可「添加到主屏幕」，像原生 App 一样全屏 + 离线 -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="脑力训练场" />

  <style>
/* ============================================================
   脑力训练场 · NeuroArena
   全局样式 — 深色现代主题，响应式，支持触屏
   ============================================================ */

:root {
  --bg: #0f1220;
  --bg-soft: #161a2e;
  --panel: #1b2038;
  --panel-2: #222847;
  --line: #2c3355;
  --text: #eef1ff;
  --muted: #9aa3c7;
  --muted-2: #6f78a0;

  /* 每个技能的主题色 */
  --reason: #8b7dff;   /* 推理 · 紫 */
  --reason-2: #5b46ff;
  --logic: #2fd39a;    /* 思维 · 绿 */
  --logic-2: #17a877;
  --reaction: #ffb020; /* 反应 · 橙 */
  --reaction-2: #ff7a1a;
  --spatial: #40c4ff;  /* 维度 · 蓝 */
  --spatial-2: #2b8bff;
  --schulte: #ff7ac0;  /* 综合 · 粉 */
  --schulte-2: #e0489f;

  --good: #35d07f;
  --bad: #ff5d6c;
  --warn: #ffc857;

  --ring: rgba(255, 255, 255, .14);  /* 棋子/色块描边 */
  --peg-mark: #ffffff;               /* 反馈点标记 */
  --arena-text: #eef1ff;             /* 反应区固定浅色文字 */
  --overlay-bg: rgba(15, 18, 32, .82);

  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 18px 45px rgba(0, 0, 0, .45);
  --ease: cubic-bezier(.22, .61, .36, 1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC",
    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: radial-gradient(1200px 800px at 15% -10%, #1a2040 0%, var(--bg) 55%),
              radial-gradient(900px 700px at 110% 10%, #171a33 0%, transparent 60%),
              var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

/* 背景光晕 */
.bg-orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; filter: blur(60px); opacity: .5; }
.orb { position: absolute; border-radius: 50%; }
.orb-1 { width: 340px; height: 340px; top: -80px; left: -60px; background: #4b3bff; opacity: .35; }
.orb-2 { width: 300px; height: 300px; bottom: -100px; right: -60px; background: #17a877; opacity: .28; }
.orb-3 { width: 260px; height: 260px; top: 40%; left: 60%; background: #2b8bff; opacity: .22; }

/* ---------- 头部 ---------- */
.app-header {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px clamp(16px, 4vw, 40px);
  gap: 12px;
}
.brand { display: flex; align-items: center; gap: 12px; cursor: pointer; border-radius: 14px; padding: 6px 8px; outline: none; }
.brand:focus-visible { box-shadow: 0 0 0 2px var(--reason-2); }
.brand-logo { font-size: 30px; line-height: 1; filter: drop-shadow(0 4px 10px rgba(91, 70, 255, .5)); }
.brand-text { display: flex; flex-direction: column; }
.brand-text strong { font-size: 18px; letter-spacing: .5px; }
.brand-text small { color: var(--muted); font-size: 11px; letter-spacing: .5px; }

.icon-btn {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text);
  width: 42px; height: 42px;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
  transition: transform .15s var(--ease), background .2s;
}
.icon-btn:hover { background: var(--panel-2); transform: translateY(-1px); }
.icon-btn:active { transform: translateY(0) scale(.96); }
.icon-btn.muted { opacity: .55; }
.header-actions { display: flex; gap: 10px; }

/* ---------- 主区域 ---------- */
.app-main {
  position: relative;
  z-index: 1;
  flex: 1;
  width: 100%;
  max-width: 960px;
  margin: 0 auto;
  padding: 8px clamp(16px, 4vw, 40px) 32px;
}

.app-footer {
  position: relative;
  z-index: 1;
  text-align: center;
  color: var(--muted-2);
  font-size: 12px;
  padding: 14px;
}

/* ---------- 首页卡片 ---------- */
.home-intro { text-align: center; margin: 6px 0 22px; }
.home-intro h1 { font-size: clamp(24px, 5vw, 34px); margin: 0 0 8px; }
.home-intro p { color: var(--muted); margin: 0; font-size: 14px; }

.card-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
@media (max-width: 560px) { .card-grid { grid-template-columns: 1fr; } }

.game-card {
  position: relative;
  text-align: left;
  background: linear-gradient(160deg, var(--panel) 0%, var(--bg-soft) 100%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  overflow: hidden;
  transition: transform .2s var(--ease), border-color .2s, box-shadow .25s;
  color: var(--text);
  font: inherit;
}
.game-card::before {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(280px 160px at 100% 0%, var(--accent, #5b46ff) 0%, transparent 70%);
  opacity: .16;
  transition: opacity .25s;
}
.game-card:hover { transform: translateY(-4px); border-color: var(--accent, #5b46ff); box-shadow: var(--shadow); }
.game-card:hover::before { opacity: .28; }
.game-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.gc-top { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.gc-icon {
  width: 54px; height: 54px; border-radius: 14px;
  display: grid; place-items: center;
  font-size: 28px;
  background: linear-gradient(150deg, var(--accent) 0%, var(--accent-2) 100%);
  box-shadow: 0 10px 24px -8px var(--accent);
}
.gc-title { display: flex; flex-direction: column; }
.gc-title b { font-size: 19px; }
.gc-title span { font-size: 12px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
.gc-desc { color: var(--muted); font-size: 13.5px; line-height: 1.6; margin: 0 0 14px; min-height: 44px; }
.gc-foot { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; }
.gc-best { color: var(--muted); }
.gc-best b { color: var(--accent); font-size: 15px; }
.gc-play { color: var(--accent); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }

/* ---------- 通用游戏界面 ---------- */
.screen { animation: fade .35s var(--ease); }
@keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.game-head {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 14px;
  flex-wrap: wrap; row-gap: 10px;
}
.game-head h2 { white-space: nowrap; }
.back-btn {
  background: var(--panel); border: 1px solid var(--line); color: var(--text);
  border-radius: 12px; padding: 9px 14px; cursor: pointer; font-size: 14px;
  display: inline-flex; align-items: center; gap: 6px; transition: background .2s, transform .15s;
}
.back-btn:hover { background: var(--panel-2); transform: translateX(-2px); }
.game-head h2 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 8px; }
.game-head .spacer { flex: 1; }

.stat-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.pill b { color: var(--text); font-variant-numeric: tabular-nums; }
.pill.accent b { color: var(--accent); }

.panel {
  background: linear-gradient(160deg, var(--panel) 0%, var(--bg-soft) 100%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: clamp(16px, 3vw, 26px);
}
.hint { color: var(--muted); font-size: 13.5px; line-height: 1.65; margin: 0 0 16px; }
.hint b { color: var(--text); }

/* 折叠式玩法说明：目标常驻，规则点开 */
.howto { margin: 0 0 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg-soft); }
.howto > summary { list-style: none; cursor: pointer; padding: 13px 16px; display: flex; align-items: center; gap: 12px; }
.howto > summary::-webkit-details-marker { display: none; }
.howto > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 14px; }
.howto-goal { flex: 1; color: var(--text); font-weight: 600; font-size: 14.5px; line-height: 1.5; }
.howto-more { color: var(--accent); font-size: 12.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.howto-more::after { content: "▾"; }
.howto[open] .howto-more::after { content: "▴"; }
.howto-body { padding: 2px 16px 15px; color: var(--muted); font-size: 13.5px; line-height: 1.75; }
.howto-body b { color: var(--text); }

.palette-label { text-align: center; color: var(--muted); font-size: 13px; margin: 4px 0 10px; }

.btn {
  border: none; border-radius: 12px; padding: 12px 20px; cursor: pointer;
  font-size: 15px; font-weight: 600; color: #fff;
  background: linear-gradient(150deg, var(--accent) 0%, var(--accent-2) 100%);
  box-shadow: 0 10px 22px -10px var(--accent);
  transition: transform .15s var(--ease), filter .2s, opacity .2s;
}
.btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; transform: none; }
.btn.ghost { background: var(--panel-2); box-shadow: none; color: var(--text); border: 1px solid var(--line); }

.center { text-align: center; }
.mt { margin-top: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }

.toast {
  position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
  padding: 12px 20px; border-radius: 12px; font-size: 14px; z-index: 50;
  opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; box-shadow: var(--shadow);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============================================================
   1) 推理 · 密码破译 (Mastermind)
   ============================================================ */
.mm-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.mm-board { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.mm-row {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-soft); border: 1px solid var(--line);
  border-radius: 14px; padding: 8px 12px;
}
.mm-row.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.mm-idx { width: 22px; text-align: center; color: var(--muted-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.mm-pegs { display: flex; gap: 8px; }
.peg {
  width: 38px; height: 38px; border-radius: 50%;
  border: 2px solid var(--ring);
  background: var(--panel-2);
  display: grid; place-items: center; cursor: default;
  transition: transform .15s;
}
.mm-row.current .peg { cursor: pointer; width: 46px; height: 46px; }
.mm-row.current .peg:hover { transform: scale(1.06); }
.mm-row.current .peg.color-empty { border-style: dashed; }
.peg.sel { box-shadow: 0 0 0 3px rgba(255,255,255,.15); }
.mm-feedback { margin-left: auto; display: grid; grid-template-columns: repeat(2, 12px); grid-auto-rows: 12px; gap: 3px; }
.fb-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line); }
.fb-dot.exact { background: var(--peg-mark); border-color: var(--peg-mark); }
.fb-dot.color { background: transparent; border-color: var(--peg-mark); }

.palette { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 14px; }
.swatch {
  width: 52px; height: 52px; border-radius: 14px; cursor: pointer; border: 2px solid var(--ring);
  transition: transform .12s, box-shadow .2s;
}
.swatch:hover { transform: translateY(-2px) scale(1.05); }
.swatch:active { transform: translateY(0) scale(.94); }

.color-0 { background: #ff5d6c; } .color-1 { background: #ffb020; }
.color-2 { background: #ffe45e; } .color-3 { background: #2fd39a; }
.color-4 { background: #40c4ff; } .color-5 { background: #b388ff; }
.color-6 { background: #ff79c6; } /* 困难模式第 7 色 */
.color-empty { background: var(--panel-2); }

/* ============================================================
   2) 思维 · 数列推理
   ============================================================ */
.seq-display {
  font-size: clamp(24px, 6vw, 40px); font-weight: 800; text-align: center;
  letter-spacing: 2px; margin: 10px 0 6px; font-variant-numeric: tabular-nums;
  min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap;
}
.seq-q { color: var(--accent); }
.seq-sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.seq-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.seq-opt {
  background: var(--bg-soft); border: 1.5px solid var(--line); color: var(--text);
  border-radius: 14px; padding: 18px; font-size: 22px; font-weight: 700; cursor: pointer;
  font-variant-numeric: tabular-nums; transition: transform .12s, border-color .2s, background .2s;
}
.seq-opt:hover { border-color: var(--accent); transform: translateY(-2px); }
.seq-opt.correct { background: rgba(53, 208, 127, .18); border-color: var(--good); }
.seq-opt.wrong { background: rgba(255, 93, 108, .16); border-color: var(--bad); }
.seq-opt:disabled { cursor: default; }

.timebar { height: 8px; background: var(--panel-2); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
.timebar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .1s linear; }

/* ============================================================
   3) 反应 · 极速反应
   ============================================================ */
.react-arena {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  max-height: 62vh;
  background: radial-gradient(circle at 50% 40%, #12162b 0%, #0c0f1e 100%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  user-select: none;
  touch-action: manipulation;
}
.react-arena.wait { cursor: pointer; }
.react-center {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px;
  color: var(--arena-text);
}
.react-center h3 { margin: 0 0 6px; font-size: clamp(20px, 5vw, 30px); }
.react-center p { margin: 4px 0; color: rgba(238, 241, 255, .7); font-size: 14px; }
.react-big { font-size: clamp(34px, 9vw, 64px); font-weight: 800; font-variant-numeric: tabular-nums; }
.react-arena.state-ready { background: radial-gradient(circle at 50% 45%, #3a2a12 0%, #241608 100%); }
.react-arena.state-go { background: radial-gradient(circle at 50% 45%, #123821 0%, #0a2716 100%); }
.react-arena.state-early { background: radial-gradient(circle at 50% 45%, #3a1420 0%, #260a12 100%); }

.target {
  position: absolute;
  width: 66px; height: 66px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff6d8, var(--reaction) 55%, var(--reaction-2));
  box-shadow: 0 0 0 6px rgba(255, 176, 32, .18), 0 8px 30px rgba(255, 122, 26, .4);
  display: grid; place-items: center; cursor: pointer;
  transform: translate(-50%, -50%) scale(0);
  animation: pop .18s var(--ease) forwards;
}
@keyframes pop { to { transform: translate(-50%, -50%) scale(1); } }
.target::after { content: "⚡"; font-size: 26px; }

/* ============================================================
   4) 维度 · 空间旋转
   ============================================================ */
.sp-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.sp-ref { text-align: center; }
.sp-ref .label { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.sp-canvas {
  background: var(--bg-soft); border: 1.5px solid var(--line); border-radius: 16px;
  display: block;
}
.sp-ref .sp-canvas { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.sp-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: 100%; max-width: 420px; }
.sp-option {
  padding: 8px; border-radius: 16px; background: transparent; border: none; cursor: pointer;
  display: grid; place-items: center; transition: transform .12s;
}
.sp-option:hover .sp-canvas { border-color: var(--accent); }
.sp-option:hover { transform: translateY(-2px); }
.sp-option.correct .sp-canvas { border-color: var(--good); box-shadow: 0 0 0 2px var(--good); }
.sp-option.wrong .sp-canvas { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad); }
.sp-option:disabled { cursor: default; }

/* ---------- 结算 ---------- */
.result-card { text-align: center; padding: 8px 0; }
.result-emoji { font-size: 54px; }
.result-card h3 { font-size: 24px; margin: 8px 0 4px; }
.result-card .big-num { font-size: 46px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.result-card .sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
.new-best { display: inline-block; background: linear-gradient(150deg, var(--accent), var(--accent-2)); color: #fff; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; margin-bottom: 12px; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

/* ---------- 难度分段控件 ---------- */
.diffbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.diffbar-label { color: var(--muted); font-size: 13px; margin-right: 2px; }
.diff-seg {
  background: var(--panel); border: 1px solid var(--line); color: var(--muted);
  border-radius: 999px; padding: 7px 16px; cursor: pointer; font-size: 13.5px; font-weight: 600;
  transition: color .18s, background .18s, border-color .18s, box-shadow .18s;
}
.diff-seg:hover { color: var(--text); border-color: var(--accent); }
.diff-seg.active { color: #fff; background: linear-gradient(150deg, var(--accent), var(--accent-2)); border-color: transparent; box-shadow: 0 8px 18px -10px var(--accent); }

/* ---------- featured 卡片（综合游戏，通栏） ---------- */
.game-card.featured { grid-column: 1 / -1; }
@media (max-width: 560px) { .game-card.featured { grid-column: auto; } }

/* ---------- 5) 综合 · 舒尔特方格 ---------- */
.schulte-grid {
  position: relative;
  display: grid;
  grid-auto-rows: 1fr;
  gap: 8px;
  width: 100%;
  max-width: 460px;
  margin: 4px auto 0;
  aspect-ratio: 1 / 1;
}
.schulte-cell {
  border: 1.5px solid var(--line);
  background: var(--bg-soft);
  color: var(--text);
  border-radius: 12px;
  font-size: clamp(18px, 5vw, 28px);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  display: grid; place-items: center;
  transition: background .15s, transform .08s, border-color .15s, opacity .2s;
  user-select: none;
}
.schulte-cell:hover { border-color: var(--accent); }
.schulte-cell:active { transform: scale(.94); }
.schulte-cell.done {
  background: linear-gradient(150deg, var(--accent), var(--accent-2));
  color: #fff; border-color: transparent; opacity: .45; cursor: default;
}
.schulte-cell.shake { animation: shake .3s; border-color: var(--bad); }
@keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }
.schulte-overlay {
  position: absolute; inset: 0;
  background: var(--overlay-bg);
  backdrop-filter: blur(3px);
  border-radius: var(--radius);
  display: grid; place-items: center; text-align: center;
  z-index: 3;
}
.schulte-overlay h3 { margin: 0 0 6px; font-size: 22px; }
.schulte-overlay p { margin: 0 0 4px; color: var(--muted); font-size: 14px; }

/* ============================================================
   浅色主题（由 <html data-theme="light"> 驱动）
   ============================================================ */
:root[data-theme="light"] {
  --bg: #eef1f8;
  --bg-soft: #ffffff;
  --panel: #ffffff;
  --panel-2: #eef1f8;
  --line: #dbe0ee;
  --text: #1b2138;
  --muted: #5c6486;
  --muted-2: #8991af;

  --ring: rgba(20, 26, 54, .16);
  --peg-mark: #1b2138;
  --shadow: 0 18px 45px rgba(38, 50, 90, .16);

:root[data-theme="light"] body {
  background: radial-gradient(1200px 800px at 15% -10%, #e6ecfb 0%, var(--bg) 55%),
              radial-gradient(900px 700px at 110% 10%, #eaf0ff 0%, transparent 60%),

}
:root[data-theme="light"] .bg-orbs { opacity: .22; }
:root[data-theme="light"] .brand-logo { filter: drop-shadow(0 4px 10px rgba(91, 70, 255, .3)); }
/* 浅色下正误提示底色略加深以保证可读 */
:root[data-theme="light"] .seq-opt.correct { background: rgba(23, 168, 119, .16); }
:root[data-theme="light"] .seq-opt.wrong { background: rgba(255, 93, 108, .14); }

/* ============================================================
   能力总览 · 雷达图 + 成绩明细
   ============================================================ */
:root { --profile: #8b90ff; --radar-grid: rgba(150, 160, 200, .22); }
:root[data-theme="light"] { --profile: #5b46ff; --radar-grid: rgba(80, 90, 130, .24); }

.stats-hero { display: flex; flex-direction: column; align-items: center; }
.radar-canvas { width: 340px; max-width: 100%; aspect-ratio: 1 / 1; display: block; }
.stats-score { text-align: center; margin-top: 2px; }
.stats-score .num { font-size: 46px; font-weight: 800; color: var(--profile); font-variant-numeric: tabular-nums; line-height: 1; }
.stats-score .rank { color: var(--muted); font-size: 14.5px; margin-top: 5px; }
.stats-note { color: var(--muted-2); font-size: 12px; text-align: center; margin-top: 12px; max-width: 380px; line-height: 1.5; }

.stats-table-wrap { overflow-x: auto; margin-top: 22px; }
.stats-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 380px; }
.stats-table th, .stats-table td { padding: 11px 12px; text-align: center; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stats-table thead th { color: var(--muted); font-weight: 600; font-size: 12px; letter-spacing: .5px; }
.stats-table td:first-child, .stats-table th:first-child { text-align: left; }
.stats-table tbody tr:last-child td { border-bottom: none; }
.stats-table .mod { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.stats-table .mod .i { font-size: 18px; }
.stats-empty { text-align: center; padding: 16px 8px; }

/* 窄屏隐藏品牌副标题，避免头部换行 */
@media (max-width: 480px) { .brand-text small { display: none; } .header-actions { gap: 8px; } }

/* ============================================================
   1) 2048
   ============================================================ */
.g2048-wrap { max-width: 460px; margin: 4px auto 0; user-select: none; }
.g2048-grid { display: grid; grid-auto-rows: 1fr; gap: 8px; aspect-ratio: 1 / 1; background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 8px; }
.g2048-cell { display: grid; place-items: center; border-radius: 9px; background: var(--bg-soft); font-weight: 800; font-variant-numeric: tabular-nums; font-size: clamp(16px, 5.2vw, 30px); color: var(--text); }
.g2048-cell.filled { animation: tilepop .12s ease; box-shadow: 0 2px 6px rgba(0, 0, 0, .18); }
.g2048-cell.big { font-size: clamp(14px, 4.4vw, 26px); }
.g2048-cell.huge { font-size: clamp(11px, 3.6vw, 21px); }
@keyframes tilepop { from { transform: scale(.82); } to { transform: scale(1); } }

/* ============================================================
   2) 连线 Flow
   ============================================================ */
.flow-wrap { max-width: 460px; margin: 4px auto 0; user-select: none; }
.flow-grid { display: grid; grid-auto-rows: 1fr; gap: 4px; aspect-ratio: 1 / 1; background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 6px; }
.flow-cell { position: relative; border-radius: 7px; background: var(--bg-soft); display: grid; place-items: center; }
.flow-cell.path { background: var(--pc); }
.flow-dot { width: 64%; height: 64%; border-radius: 50%; background: var(--pc); box-shadow: 0 1px 5px rgba(0, 0, 0, .35); }

/* ============================================================
   3) 扫雷 Minesweeper
   ============================================================ */
.mine-wrap { max-width: 100%; overflow-x: auto; margin: 4px auto 0; }
.mine-grid { display: grid; gap: 3px; width: min(100%, 520px); margin: 0 auto; touch-action: manipulation; }
.mine-cell { aspect-ratio: 1 / 1; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: clamp(11px, 3.2vw, 17px); cursor: pointer; user-select: none; font-variant-numeric: tabular-nums; }
.mine-cell.rev { background: var(--bg-soft); border-color: transparent; cursor: default; }
.mine-cell.boom { background: rgba(255, 93, 108, .32); border-color: var(--bad); }
.mine-cell:not(.rev):active { transform: scale(.92); }

/* ============================================================
   4) 记忆翻牌 Memory
   ============================================================ */
.mem-grid { display: grid; gap: 10px; max-width: 460px; margin: 4px auto 0; }
.mem-card { position: relative; aspect-ratio: 3 / 4; border-radius: 12px; border: none; cursor: pointer; background: linear-gradient(150deg, var(--accent), var(--accent-2)); display: grid; place-items: center; transition: transform .12s; }
.mem-card:active { transform: scale(.95); }
.mem-card::after { content: "?"; position: absolute; color: rgba(255, 255, 255, .6); font-weight: 800; font-size: clamp(18px, 5vw, 28px); }
.mem-card.up::after, .mem-card.done::after { content: ""; }
.mem-card.up, .mem-card.done { background: var(--bg-soft); border: 1px solid var(--line); }
.mem-card.done { opacity: .5; }
.mem-face { font-size: clamp(22px, 7vw, 40px); opacity: 0; transition: opacity .1s; }
.mem-card.up .mem-face, .mem-card.done .mem-face { opacity: 1; }

    boardWrap.addEventListener("pointerup", (e) => { if (!swiping) return; swiping = false; const dx = e.clientX - sx, dy = e.clientY - sy; if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return; if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : 3); else move(dy > 0 ? 2 : 0); });

  /* ==========================================================
     2) 连线 · Flow（不交叉连通 + 铺满）
     ========================================================== */
  const FLOW_CFG = { easy: { n: 5 }, normal: { n: 6 }, hard: { n: 7 } };
  const FLOW_COLORS = ["#ff5d6c", "#40c4ff", "#ffb020", "#2fd39a", "#b388ff", "#ff7ac0", "#ffe45e", "#5ad1c9", "#8b7dff", "#fa8c16", "#13c2c2", "#a0d911", "#eb2f96", "#597ef7"];
  // 快速生成随机哈密顿路径（backbite 算法）：从蛇形路径出发，反复对端点做“回咬”

  function randomHamil(N) {

  // 生成保证可解的连线谜题：随机哈密顿路径 → 切成若干段 → 每段两端为一对同色端点
  function genFlow(N) {

    while (i < path.length) { const remaining = path.length - i; let len = 2 + rand(4); if (len > remaining) len = remaining; if (remaining - len === 1) len = remaining; segs.push(path.slice(i, i + len)); i += len; }

  function startFlow(diff) {

    const puz = genFlow(N), COLORS = puz.endpoints.length;
    const owner = Array.from({ length: N }, () => Array(N).fill(-1)); // 每格归属颜色
    const isEnd = Array.from({ length: N }, () => Array(N).fill(-1)); // 端点归属颜色
    const paths = {}; // color -> [[r,c]...]
    const done = {}; // color -> bool
    puz.endpoints.forEach(([a, b], col) => { isEnd[a[0]][a[1]] = col; isEnd[b[0]][b[1]] = col; owner[a[0]][a[1]] = col; owner[b[0]][b[1]] = col; });

    let startAt = 0, started = false, tickTimer = null, finished = false;
    const pipePill = h("div", { class: "pill accent" }, "连通 ", h("b", null, "0/" + COLORS));
    const fillPill = h("div", { class: "pill" }, "覆盖 ", h("b", null, "0%"));
    const timePill = h("div", { class: "pill" }, "⏱ ", h("b", null, "0.0s"));
    const shell = gameShell(game, diff, [pipePill, fillPill, timePill]);
    shell.panel.appendChild(howto("从一个圆点按住拖到同色的另一个圆点，连线不能交叉",
      "把每一对同色圆点用线连起来，并且 ", h("b", null, "铺满整个棋盘"), " 才算通关。再次从某个圆点拖动可重画该颜色；用时越短越好。"));
    const boardWrap = h("div", { class: "flow-wrap", style: { touchAction: "none" } });
    const boardEl = h("div", { class: "flow-grid", style: { gridTemplateColumns: "repeat(" + N + ",1fr)" } });
    boardWrap.appendChild(boardEl); shell.panel.appendChild(boardWrap);
    shell.panel.appendChild(h("div", { class: "row center mt" }, h("button", { class: "btn ghost", onclick: () => { Sound.click(); startFlow(diff); } }, "换一题"), h("button", { class: "btn ghost", onclick: () => { Sound.click(); clearAll(); } }, "清空")));

    const cells = [];
    for (let r = 0; r < N; r++) { cells[r] = []; for (let c = 0; c < N; c++) { const el = h("div", { class: "flow-cell" }); cells[r][c] = el; boardEl.appendChild(el); } }

    function paint() {
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        const el = cells[r][c], col = owner[r][c];
        el.className = "flow-cell" + (isEnd[r][c] >= 0 ? " endpoint" : "") + (col >= 0 && isEnd[r][c] < 0 ? " path" : "");
        el.innerHTML = "";
        if (col >= 0) { el.style.setProperty("--pc", FLOW_COLORS[col]); if (isEnd[r][c] >= 0) el.appendChild(h("span", { class: "flow-dot" })); }
        else el.style.removeProperty("--pc");
      }
      const connected = Object.keys(done).filter((k) => done[k]).length;
      let filled = 0; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (owner[r][c] >= 0) filled++;

    function begin(e) {
      if (finished) return;
      const p = cellFromXY(e.clientX, e.clientY); if (!p) return;
      const [r, c] = p; const col = isEnd[r][c];
      if (col < 0) return; // 只能从端点起笔

  /* ==========================================================
     3) 扫雷 · Minesweeper
     ========================================================== */
  const MINE_CFG = { easy: { r: 9, c: 9, m: 10 }, normal: { r: 12, c: 12, m: 26 }, hard: { r: 14, c: 14, m: 45 } };
  const MINE_NUM = ["", "#2b8bff", "#17a877", "#ff5d6c", "#8b5cf6", "#ff7a1a", "#13c2c2", "#eb2f96", "#8a8a8a"];
  function startMine(diff) {
    diff = diff || getDiff("mine");
    const game = meta("mine"), cfg = MINE_CFG[diff], R = cfg.r, C = cfg.c, M = cfg.m;
    let grid = Array.from({ length: R }, () => Array.from({ length: C }, () => ({ mine: false, rev: false, flag: false, adj: 0 })));
    let started = false, over = false, win = false, revealedCount = 0, flags = 0, startAt = 0, tickTimer = null, flagMode = false;
    const minePill = h("div", { class: "pill accent" }, "💣 ", h("b", null, String(M)));
    const timePill = h("div", { class: "pill" }, "⏱ ", h("b", null, "0"));
    const bestPill = bestPillEl(game, diff);
    const shell = gameShell(game, diff, [minePill, timePill, bestPill]);
    shell.panel.appendChild(howto("翻开安全格，数字代表周围 8 格里的地雷数",
      "推断出雷的位置，翻开所有非雷格即获胜（用时越短越好）。切到 ", h("b", null, "🚩标记"), " 模式可插旗（手机长按格子也能插旗），", h("b", null, "首次点击必定安全"), "。"));
    const modeBtn = h("button", { class: "btn ghost", onclick: () => { flagMode = !flagMode; modeBtn.textContent = flagMode ? "🚩 标记模式（点我切回）" : "⛏️ 挖开模式（点我切换标记）"; } }, "⛏️ 挖开模式（点我切换标记）");
    shell.panel.appendChild(h("div", { class: "row center", style: { marginBottom: "12px" } }, modeBtn));
    const boardWrap = h("div", { class: "mine-wrap" });
    const boardEl = h("div", { class: "mine-grid", style: { gridTemplateColumns: "repeat(" + C + ",1fr)" } });
    boardWrap.appendChild(boardEl); shell.panel.appendChild(boardWrap);

      if (cell.adj === 0) for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { const rr = r + dr, cc = c + dc; if (rr >= 0 && rr < R && cc >= 0 && cc < C) reveal(rr, cc); }
    }
    function toggleFlag(r, c) { const cell = grid[r][c]; if (cell.rev) return; cell.flag = !cell.flag; flags += cell.flag ? 1 : -1; minePill.querySelector("b").textContent = String(M - flags); Sound.click(); render(); }

    }

    function render() {

  /* ==========================================================
     4) 记忆翻牌 · Memory Match
     ========================================================== */
  const MEM_CFG = { easy: { r: 4, c: 4 }, normal: { r: 4, c: 5 }, hard: { r: 6, c: 6 } };
  const MEM_EMOJI = ["🍎", "🍊", "🍋", "🍇", "🍉", "🍓", "🍒", "🥝", "🍑", "🥥", "🍍", "🥭", "🍌", "🫐", "🥑", "🍅", "🌽", "🥕", "🍆", "🫑"];

    let moves = 0, matched = 0, flipped = [], lock = false, started = false, startAt = 0;
    const movesPill = h("div", { class: "pill accent" }, "步数 ", h("b", null, "0"));
    const pairsPill = h("div", { class: "pill" }, "配对 ", h("b", null, "0/" + PAIRS));
    const bestPill = bestPillEl(game, diff);
    const shell = gameShell(game, diff, [movesPill, pairsPill, bestPill]);
    shell.panel.appendChild(howto("翻开两张卡片，找出所有相同的一对",
      "记住翻开过的图案位置，把每次翻牌都用在刀刃上。全部配对成功即通关，", h("b", null, "步数越少越好"), "。"));
    const faces = shuffle([...MEM_EMOJI.slice(0, PAIRS), ...MEM_EMOJI.slice(0, PAIRS)]);
    const grid = h("div", { class: "mem-grid", style: { gridTemplateColumns: "repeat(" + C + ",1fr)" } });
    const cards = faces.map((face, i) => { const el = h("button", { class: "mem-card", onclick: () => flip(i) }, h("span", { class: "mem-face" }, face)); return { face, el, done: false, up: false }; });
    cards.forEach((c) => grid.appendChild(c.el));
    shell.panel.appendChild(grid);

    function flip(i) {
      const c = cards[i]; if (lock || c.up || c.done) return;
      if (!started) { started = true; startAt = performance.now(); }
      c.up = true; c.el.classList.add("up"); Sound.pop(); flipped.push(i);
      if (flipped.length === 2) {

        else setTimeout(() => { cards[a].up = cards[b].up = false; cards[a].el.classList.remove("up"); cards[b].el.classList.remove("up"); flipped = []; lock = false; Sound.bad(); }, 820);
      }
    }
    function finish() {
      const ms = Math.round(performance.now() - startAt);
      const rec = recordBest("memory", diff, moves, true); Sound.win();
      shell.panel.innerHTML = "";
      shell.panel.appendChild(resultCard({ emoji: "🎉", isBest: rec.isBest, title: "全部配对成功！", big: moves + " 步", sub: "用时 " + (ms / 1000).toFixed(1) + " 秒 · " + diffName(diff) + "最佳 " + rec.best + " 步", onRetry: () => startMemory(diff) }));
    }
    mount(shell.section); currentGame = { teardown() {} };
  }

  /* ==========================================================
     成绩总览
     ========================================================== */
  function showStats() {
    const any = GAMES.some((g) => DIFFS.some((d) => getBest(g.id, d.id) != null));
    const head = h("div", { class: "game-head" }, h("button", { class: "back-btn", onclick: () => { Sound.click(); goHome(); } }, "‹ 返回"), h("h2", null, "📊 成绩总览"), h("div", { class: "spacer" }));
    const panel = h("div", { class: "panel" });
    const section = h("section", { class: "screen", style: { "--accent": "var(--profile)", "--accent-2": "var(--profile)" } }, head, panel);
    if (!any) {
      panel.appendChild(h("div", { class: "stats-empty" }, h("div", { class: "result-emoji" }, "📊"), h("h3", { style: { margin: "8px 0 6px" } }, "还没有任何成绩"), h("p", { class: "hint", style: { textAlign: "center" } }, "先去玩几局，这里会汇总你在各游戏、各难度下的最佳成绩。"), h("div", { class: "row center" }, h("button", { class: "btn", onclick: goHome }, "去玩一局 ▶"))));
      mount(section); currentGame = { teardown() {} }; return;
    }
    const rows = GAMES.map((g) => h("tr", null,
      h("td", null, h("span", { class: "mod" }, h("span", { class: "i" }, g.icon), g.name)),
      ...DIFFS.map((d) => { const b = getBest(g.id, d.id); return h("td", null, b == null ? "—" : g.bestLabel(b)); })));
    panel.appendChild(h("div", { class: "stats-table-wrap" }, h("table", { class: "stats-table" },
      h("thead", null, h("tr", null, h("th", null, "游戏"), ...DIFFS.map((d) => h("th", null, d.name)))),
      h("tbody", null, rows))));
    panel.appendChild(h("p", { class: "stats-note" }, "2048 记最高分（越高越好）；连线、扫雷记最短用时；记忆翻牌记最少步数（越小越好）。"));
    mount(section); currentGame = { teardown() {} };
  }

  /* -------------------- 启动 -------------------- */
  goHome();
})();

</script>
  <script>
    /* 注册 Service Worker（仅在 https/localhost 生效，file:// 会静默失败） */
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
